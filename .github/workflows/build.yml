name: Build Custom Telegram iOS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1. Checkout Official Telegram Code (Base)
        run: |
          echo "Скачиваем официальный код..."
          git clone --recursive --depth 1 https://github.com/TelegramMessenger/Telegram-iOS.git telegram-src

      - name: 2. Checkout Your Custom Code
        uses: actions/checkout@v4
        with:
          path: user-custom-code

      - name: 3. Merge Your Modifications
        run: |
          echo "Накладываем твои изменения..."
          rsync -av --exclude='.git' --exclude='.github' user-custom-code/ telegram-src/

      - name: 4. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 5. Install Dependencies
        run: |
          brew install yasm
          brew install bazelisk

      - name: 6. Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Используем: $XCODE"
          sudo xcode-select -s "$XCODE"
          REAL_VERSION=$(xcodebuild -version | grep "Xcode" | awk '{print $2}')
          echo "XCODE_VERSION=$REAL_VERSION" >> $GITHUB_ENV

      - name: 7. Patch Configuration
        run: |
          cd telegram-src
          echo "Исправляем ловушки в конфигах..."
          
          # Заменяем тот самый плейсхолдер с пробелами на нормальную слитную строку
          sed -i '' 's/! a random string !/lendicbuild2026/g' build-system/template_minimal_development_configuration.json
          
          # Подменяем версию Xcode, как мы делали раньше
          find . -name "versions.json" -exec sed -i '' "s/26.4/$XCODE_VERSION/g" {} +

      - name: 8. Compile Telegram via Bazel
        env:
          API_ID: "6"
          API_HASH: "eb06d4abfb49dc3eeb1aeb98ae0f581e"
        run: |
          cd telegram-src
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --buildNumber 100000 \
            --xcodeManagedCodesigning \
            --configuration=release_arm64

      - name: 9. Package to IPA
        run: |
          cd telegram-src
          echo "Упаковка скомпилированного .app в .ipa..."
          mkdir -p Payload
          
          # Ищем собранный Telegram.app
          APP_PATH=$(find bazel-out -type d -name "Telegram.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "Telegram.app" -not -path "*/.git/*" | head -1)
          fi
          
          # Копируем с разрешением реальных путей (-L)
          cp -RL "$APP_PATH" Payload/
          zip -qyr ../Telegram-Custom.ipa Payload

      - name: 10. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-Build
          path: Telegram-Custom.ipa
          retention-days: 7
