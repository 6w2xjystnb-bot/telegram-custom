name: Build Custom Telegram iOS 26

on:
  workflow_dispatch: # Добавляет кнопку "Run workflow" во вкладке Actions

jobs:
  build:
    runs-on: macos-latest # Используем сервер Apple с актуальными версиями Xcode и SDK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Критически важно: без этого не скачаются нужные библиотеки
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          brew install yasm
          brew install bazelisk

      - name: Compile Telegram
        env:
          # Вшитые публичные ключи, чтобы сервер Telegram пропускал авторизацию
          API_ID: "6"
          API_HASH: "eb06d4abfb49dc3eeb1aeb98ae0f581e"
        run: |
          # Запуск официального скрипта сборки
          python3 build-system/Make/Make --cacheDir="$HOME/bazel-cache" build --configuration release

      - name: Package to IPA
        run: |
          echo "Упаковка скомпилированного .app в .ipa..."
          mkdir -p Payload
          
          # Находим скомпилированный Telegram.app и копируем его в Payload
          # Путь может слегка отличаться в зависимости от структуры внутри build-dir
          find build-dir -type d -name "Telegram.app" -exec cp -R {} Payload/ \;
          
          # Архивируем в установочный пакет
          zip -qr Telegram-Custom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-Build
          path: Telegram-Custom.ipa
          retention-days: 7 # Файл будет храниться на GitHub 7 дней
